<script>
(()=>{'use strict';
const SCENARIOS={gym:{name:'健身房恢复训练',short:'恢复力量',emoji:'🏋️',subtitle:'停练半年 · 曾有基础 · 器械场地模拟齐全',age:'32岁虚构成年人',focus:'增肌与重新建立训练习惯'},outdoor:{name:'户外零器械入门',short:'无器械环境',emoji:'🌳',subtitle:'没有已购买的器械 · 夜间场地 · 增肌目标受限',age:'35岁虚构成年人',focus:'基础体能与环境条件确认'},partial:{name:'训练未完成反馈',short:'反馈与调整',emoji:'📋',subtitle:'只练两次 · 部分动作漏练 · 负荷记录缺失',age:'35岁虚构成年人',focus:'训练记录及下一步调整'}};
const QUESTIONS=[{key:'goal',title:'这位模拟客户最在意什么？',desc:'仅选择虚构客户的目标，不填写你的真实健康信息。',opts:[['muscle','增肌与体态改善'],['routine','建立稳定训练习惯'],['fitness','改善一般体能']]},{key:'days',title:'计划每周哪几天训练？',desc:'这只是模拟日历。若时间没确定，要如实保留“未知”。',opts:[['mfs','周一、周五、周六'],['wfs','周三、周五、周六'],['tfs','周二、周五、周六'],['unknown','尚未确定']]},{key:'duration',title:'每次实际能安排多久？',desc:'页面会为热身、换器械和整理预留时间。',opts:[['60','最多60分钟'],['40','最多40分钟'],['unknown','时间还不确定']]},{key:'equipment',title:'哪些训练条件已经具备？',desc:'“准备购买”和“已经拥有”不能混为一谈；墙面与支撑也不能默认可用。',opts:[['gym','健身房器械已确认可用'],['none','目前无器械，且安全支撑未知'],['planned','计划购买弹力带，但还没买'],['unknown','器械和场地都不确定']]},{key:'screen',title:'请选择模拟客户的安全筛查结果',desc:'这是预设虚构剧情，不采集你的真实疾病、症状或医疗信息。',opts:[['none','模拟资料中未发现已知红旗（不等于医学放行）'],['pain','模拟资料显示训练相关关节疼痛'],['bp','模拟资料显示未评估的明显高血压'],['unknown','关键筛查资料未知']]},{key:'recovery',title:'模拟客户最近的恢复情况如何？',desc:'睡眠、疲劳和恢复状况也会影响是否能给出完整的计划展示。',opts:[['normal','自述休息正常，无明显疲劳'],['tired','近期明显疲劳、恢复较差'],['unknown','没有相关记录']]},{key:'style',title:'选择你更想体验的页面风格',desc:'两种仅改变信息呈现；不改变任何安全边界。',opts:[['evidence','循证清晰版 · 结构化、易追踪'],['inspired','灵感体验版 · 更轻松的表达']]}];

const state={page:'home',scenario:null,step:0,answers:{},logs:{},minutes:54,effort:5,obstacle:'unknown',saved:false,choice:null,rate:0,willing:'undecided',goalDone:{},resultSaved:false,started:Date.now()};

const selected=()=>SCENARIOS[state.scenario]||SCENARIOS.gym;
function status(){if(!state.scenario)return 'NOT_STARTED';if(!QUESTIONS.every(q=>state.answers[q.key]))return 'INCOMPLETE';if(state.answers.screen==='bp'||state.answers.screen==='pain')return 'BLOCKED_SAFETY';if(state.answers.screen==='unknown')return 'NEED_ONE_ANSWER';if(state.answers.days==='unknown'||state.answers.duration==='unknown'||state.answers.recovery==='unknown'||state.answers.recovery==='tired')return 'NEED_ONE_ANSWER';if(state.answers.equipment==='unknown')return 'NEED_ONE_ANSWER';if(state.answers.equipment==='none'||state.answers.equipment==='planned')return 'PROVISIONAL';return 'READY';}
function checkpoints(){return{interview:!!state.scenario&&QUESTIONS.every(q=>state.answers[q.key]),plan:!!state.goalDone.plan,log:!!state.saved,adjust:!!state.goalDone.adjust};}
function wrap(content){const cp=checkpoints();document.getElementById('app').innerHTML=`<div class="shell"><aside class="side"><div class="brand"><div class="brand-mark">${ico('spark',22)}</div><div>循练<small>FIT FLOW · DEMO</small></div></div><div class="side-caption">探索原型 / EXPLORE</div><div class="side-nav">${navs.map(([id,label,icon])=>`<button class="nav-btn ${state.page===id?'active':''}" data-nav="${id}"><span class="nav-icon">${ico(icon)}</span>${label}${cp[id]?' ·':''}</button>`).join('')}</div><div class="side-note"><b>仅供产品体验</b>所有身份、训练计划和日志均为合成示例。无需登录，不向服务器提交信息，不提供真实运动处方。</div></aside><main class="main"><div class="topbar"><div class="eyebrow">FIT FLOW / 体验版 01</div><div class="topright"><span class="version">基于 Skill V1.3.4</span><span class="safe-pill">● 未经真人审核</span></div></div><div class="screen-in">${content}</div></main></div><nav class="bottom" aria-label="主导航">${navs.map(([id,label,icon])=>`<button class="${state.page===id?'active':''}" data-nav="${id}" aria-label="${label}">${ico(icon)}<span>${label}</span></button>`).join('')}</nav>`;}
function home(){const cp=checkpoints();return `<div class="hero"><small>${ico('spark',15)} FIRST INTERACTIVE PROTOTYPE</small><h1>好计划，<br>从了解开始。</h1><p>7个简短问题，让虚构客户完成训练访谈，再体验计划展示、打卡和动态调整。无需登录，也不收集真实健康数据。</p><div class="hero-actions"><button class="btn btn-primary" data-nav="interview">开始模拟体验 ${ico('arrow',16)}</button><button class="btn btn-ghost" data-nav="plan">看看计划预览</button></div></div><div class="section"><div class="section-head"><h2>一份计划，四段体验</h2><div class="hint">约 3–5 分钟<br>离线可用</div></div><div class="feature-grid"><div class="feature"><div class="feature-icon">${ico('chat')}</div><h3>逐步访谈</h3><p>每次只问一个关键问题，未知就标未知。</p></div><div class="feature"><div class="feature-icon">${ico('plan')}</div><h3>计划草稿</h3><p>展示虚构日程、动作模式及时间预算。</p></div><div class="feature"><div class="feature-icon">${ico('log')}</div><h3>训练日志</h3><p>体验完成、部分完成、跳过与原因记录。</p></div><div class="feature"><div class="feature-icon">${ico('adjust')}</div><h3>调整演示</h3><p>遇到冲突、缺设备或不适时展示规则。</p></div></div></div><div class="section"><div class="section-head"><h2>你的体验进度</h2><span class="tag tag-gray">${Object.values(cp).filter(Boolean).length} / 4</span></div><div class="card">${[['interview','完成虚构客户访谈','约7个问题'],['plan','查看示例计划','状态、器械和时间检查'],['log','填写一份模拟日志','无真实运动数据'],['adjust','查看一次计划调整','有原因才有变化']].map(([id,t,sub],i)=>`<div class="task-row"><div class="task-dot ${cp[id]?'done':''}">${cp[id]?ico('check',15):i+1}</div><div><div class="task-name">${t}</div><div class="task-sub">${sub}</div></div><button class="small-link" data-nav="${id}">${cp[id]?'再看':'进入'} ›</button></div>`).join('')}</div></div><div class="section"><div class="notice">${ico('shield',17)}<span>本原型由 V1.3.4 的部分已测规则制作，使用固定的本地模拟逻辑，不连接 Claude 或任何 AI 服务。展示仅用于评估产品交互，禁止按页面计划实际训练。</span></div></div>`;}
function persona(){return `<button class="back-link" data-nav="home">← 返回首页</button><div class="eyebrow">STEP 00 / 虚构资料</div><h1 class="page-title">选择一位模拟客户</h1><p class="page-desc">所有情境都是虚构的。选一个案例体验完整流程，不需要输入自己的病史、身体指标或身份信息。</p><div class="persona-list">${Object.entries(SCENARIOS).map(([id,s])=>`<button class="persona-card" data-persona="${id}"><span class="avatar">${s.emoji}</span><span><div class="persona-title">${s.name}</div><div class="persona-sub">${s.subtitle}</div></span><span style="color:#9eafa2">${ico('right',20)}</span></button>`).join('')}</div><div class="section"><div class="notice">${ico('lock',18)}<span>这不是健康调查：请选择虚构角色的选项。页面中没有帐号、网络请求或第三方统计；当前会话的模拟数据仅在网页打开期间暂存。</span></div></div>`;}
function interview(){if(!state.scenario)return persona();if(state.step>=QUESTIONS.length)return profile();const q=QUESTIONS[state.step],progress=Math.round(state.step/QUESTIONS.length*100);return `<button class="back-link" data-back="1">← ${state.step===0?'更换模拟客户':'上一个问题'}</button><div class="eyebrow">访谈 / ${selected().name}</div><div class="q-progress" aria-label="进度 ${progress}%"><i style="width:${progress}%"></i></div><div class="q-card"><div class="q-serial">${ico('chat',16)} QUESTION ${String(state.step+1).padStart(2,'0')} / ${String(QUESTIONS.length).padStart(2,'0')}</div><h2>${q.title}</h2><p class="q-desc">${q.desc}</p><div class="options">${q.opts.map(([v,label])=>`<button class="opt ${state.answers[q.key]===v?'selected':''}" data-answer="${escapeHtml(v)}"><span>${escapeHtml(label)}</span><span class="circle">${state.answers[q.key]===v?ico('check',13):''}</span></button>`).join('')}</div><div class="q-footer"><span>一次只回答一个问题</span><span>${state.step+1} / ${QUESTIONS.length}</span></div></div><div class="profile-chips"><span class="chip">${selected().emoji} ${selected().age}</span><span class="chip">模拟模式</span><span class="chip">无真实资料上传</span></div>`;}
function profile(){const st=status();return `<button class="back-link" data-back="1">← 修改访谈答案</button><div class="eyebrow">访谈完成 / PROFILE</div><h1 class="page-title">模拟客户画像</h1><p class="page-desc">以下信息只来自你在当前对话里选择的选项，未选择的条件保持未知。</p><div class="card"><div style="display:flex;gap:13px;align-items:center;margin-bottom:18px"><span class="avatar">${selected().emoji}</span><div><b>${selected().name}</b><p class="hint">${selected().age} · 虚构客户</p></div></div>${QUESTIONS.map(q=>`<div class="task-row" style="grid-template-columns:100px minmax(0,1fr);gap:8px"><div class="hint">${({goal:'主要目标',days:'训练日',duration:'可用时间',equipment:'器械状态',screen:'风险资料',recovery:'恢复情况',style:'展示风格'})[q.key]}</div><div style="font-size:12px;line-height:1.55;font-weight:680">${escapeHtml(answerLabel(q.key,state.answers[q.key]))}</div></div>`).join('')}</div><div class="section"><div class="notice">${ico('shield',17)}<span>当前判断状态为 <b>${st}</b>，是模拟数据的产品状态，不代表医学评估结果，也不赋予真人跟练许可。</span></div></div><div class="section"><button class="btn btn-dark btn-wide" data-nav="plan">查看模拟计划草稿 ${ico('arrow',17)}</button></div>`;}
const planDays={mfs:[['周一','全身基础'],['周五','上肢模式'],['周六','下肢与整理']],wfs:[['周三','全身基础'],['周五','上肢模式'],['周六','下肢与整理']],tfs:[['周二','全身基础'],['周五','上肢模式'],['周六','下肢与整理']]};
function exercises(typ){const compact=state.answers.duration==='40';if(typ===0)return [{n:'膝主导 · 仅展示',r:'2组 · 示意',info:'模拟器械 / 具体负荷留空'},{n:'水平推 · 仅展示',r:'2组 · 示意',info:'动作质量未现场核实'},{n:'水平拉 · 仅展示',r:'2组 · 示意',info:'未核实器械则不得必做'},...(compact?[]:[{n:'核心稳定 · 选做',r:'时间允许',info:'示例占位；不要求真人操作'}])];if(typ===1)return[{n:'上肢推的动作模式',r:'演示',info:'上肢负荷按模拟恢复状态调整'},{n:'上肢拉的动作模式',r:'演示',info:'不得在未记录时自动加重量'},...(compact?[]:[{n:'辅助动作 · 选做',r:'可略过',info:'模拟训练卡中的末尾可选项'}])];return[{n:'下肢动作模式',r:'演示',info:'与前一日上肢模拟训练区分'},{n:'髋部控制 / 基础活动',r:'演示',info:'模拟占位；不是实际训练建议'},{n:'整理与恢复记录',r:'必展示',info:'不因缺练加量或补债'}];}
function exerciseHtml(ex,i){return `<div class="exercise"><span class="n">${String(i+1).padStart(2,'0')}</span><div><h4>${ex.n}</h4><p>${ex.info}</p></div><span class="sets">${ex.r}</span></div>`;}
function plan(){if(!state.scenario||!QUESTIONS.every(q=>state.answers[q.key]))return `<div class="eyebrow">计划 / PREVIEW</div><h1 class="page-title">先完成模拟访谈</h1><p class="page-desc">计划草稿必须基于当前虚构客户选择的条件生成，不能借用其他案例。</p><button class="btn btn-dark" data-nav="interview">进入访谈 ${ico('arrow',16)}</button>`;state.goalDone.plan=true;const st=status();const isBlock=st==='BLOCKED_SAFETY',isNeed=st==='NEED_ONE_ANSWER',isProv=st==='PROVISIONAL',labels={BLOCKED_SAFETY:['风险阻断','模拟档案存在值得专业评估的不适或风险。此处不展示具体训练量。'],NEED_ONE_ANSWER:['关键信息不足','训练日、时长、安全或器械条件存在未知项，暂不展示完整训练卡。'],PROVISIONAL:['条件受限草稿','器械尚未拥有或支撑条件不明，只展示环境准备与能力基础阶段，不能称为完整增肌方案。'],READY:['模拟计划草稿','虚构数据的日程与条件满足本页演示逻辑，不代表实际训练安全通过。']}[st]||['暂无计划',''];let dayrows=planDays[state.answers.days]||[];return `<div class="eyebrow">计划 / MOCK PLAN</div><h1 class="page-title">让计划有依据。</h1><p class="page-desc">示例不包含个人真实训练重量，也不会将模拟就绪状态视为医疗或教练批准。</p><div class="plan-banner ${isBlock?'danger':(isNeed||isProv)?'warn':''}"><span class="tag ${isBlock?'tag-red':(isNeed||isProv)?'tag-yellow':'tag-green'}">${st}</span><h2>${labels[0]}</h2><p>${labels[1]}</p></div><div class="plan-info"><div class="stat"><div class="stat-value">${state.answers.days==='unknown'?'待确认':'3天'}</div><div class="stat-label">周频率 / 虚构</div></div><div class="stat"><div class="stat-value">${state.answers.duration==='unknown'?'未知':state.answers.duration+'min'}</div><div class="stat-label">单次时长</div></div><div class="stat"><div class="stat-value">${selected().emoji}</div><div class="stat-label">案例 ${state.scenario==='gym'?'A':state.scenario==='outdoor'?'B':'C'}</div></div></div>${isBlock?`<div class="section"><div class="notice">${ico('alert',18)}<span>演示分支已阻断训练处方。对于现实中的胸痛、晕厥、异常气促、未评估的严重血压问题或持续伤痛，应当由医疗专业人员判断，不由本网页放行训练。</span></div></div>`:isNeed?`<div class="section"><div class="card"><h3>缺少的关键确认</h3><p class="page-desc" style="margin-top:9px">${state.answers.screen==='unknown'?'虚构客户的基本风险资料尚未填写。':state.answers.days==='unknown'?'虚构客户尚未确认训练日。':state.answers.duration==='unknown'?'每次可用时间未知。':state.answers.recovery==='unknown'?'恢复情况尚未确认。':state.answers.recovery==='tired'?'模拟客户明显疲劳，暂不出完整计划，先确认恢复情况。':'场地和器械条件未核实。'}</p><button class="btn btn-white" data-nav="interview">回到访谈完善</button></div></div>`:isProv?`<div class="section"><div class="card"><h3 style="margin-bottom:10px">目前只能展示受限阶段</h3><p class="page-desc">未实际购入的弹力带不可安排为必备器械；未知的墙面或桌沿也不应默认安全。无合适推拉训练条件时，不能宣称完整增肌。</p><div class="lab">已确认：${escapeHtml(answerLabel('equipment',state.answers.equipment))}<br>仍未知：稳定支撑、可用推拉阻力、现场安全条件。<br>建议产品操作：询问缺少的条件，先展示条件确认卡，暂不生成完整训练处方。</div></div></div>`:`<div class="section"><div class="section-head"><h2>一周训练卡 · 虚构示例</h2><div class="hint">无公斤数 / 不可跟练</div></div>${dayrows.map(([day,name],i)=>`<div class="day-card"><div class="day-head"><div><strong>${day} · ${name}</strong><div class="micro" style="margin-top:5px">${i===2?'与周五相邻，必须复核负荷重叠':'模拟训练结构与动作模式'}</div></div><span class="tag tag-gray">DAY 0${i+1}</span></div>${exercises(i).map(exerciseHtml).join('')}</div>`).join('')}<div class="lab">时间预算：模拟${state.answers.duration}分钟，必须包含热身、动作衔接、器械切换及结束整理。真实可用器械、动作技术与恢复未经过专业核实。历史负荷与实际完成记录均为未知。</div></div>`}<div class="section"><div class="section-head"><h2>下一步怎么体验？</h2></div><div class="action-grid"><button class="btn btn-white" data-nav="log">填写模拟训练日志 ${ico('log',16)}</button><button class="btn btn-dark" data-nav="adjust">体验计划变化 ${ico('adjust',16)}</button></div><p class="micro flushed">模拟测试规则来自 V1.3.4；这不是实时调用 AI 的个性化建议。</p></div>`;}
function initialLogs(){return [{title:'动作模式A · 推',status:'done'},{title:'动作模式B · 拉',status:'partial'},{title:'动作模式C · 下肢',status:'skip'},{title:'辅助动作D',status:'unknown'}]}
function log(){if(!state.scenario)return `<h1 class="page-title">先选择虚构客户</h1><p class="page-desc">日志输入仅用于演示，必须绑定当前模拟档案。</p><button class="btn btn-dark" data-nav="interview">开始访谈</button>`;if(!state.logs.items)state.logs.items=initialLogs();return `<div class="eyebrow">日志 / DEMO INPUT</div><h1 class="page-title">每一次训练，都有迹可循。</h1><p class="page-desc">只填写模拟完成情况。未做就标“未做”，没记录就标“未知”；不能事后补造重量、组数或次数。</p><div class="card"><div class="section-head" style="margin-bottom:4px"><h2>模拟训练日志</h2><span class="tag tag-yellow">非真实记录</span></div>${state.logs.items.map((x,i)=>`<div class="log-row"><div><h4>${x.title}</h4><p>请选择这项模拟任务的完成情况</p></div><div class="togglebar">${[['done','完成'],['partial','部分完成'],['skip','未做'],['unknown','未记录']].map(([v,label])=>`<button class="tog ${x.status===v?'sel':''}" data-logstatus="${i}|${v}">${label}</button>`).join('')}</div></div>`).join('')}<hr class="separator"><div class="field"><div class="field-label"><span>模拟训练用时</span><small><span id="minutesLabel">${state.minutes}</span> 分钟</small></div><input aria-label="模拟训练用时" id="minutes" type="range" min="20" max="75" step="1" value="${state.minutes}"></div><div class="field"><div class="field-label"><span>模拟整体吃力程度</span><small><span id="effortLabel">${state.effort}</span>/10</small></div><input aria-label="模拟整体吃力程度" id="effort" type="range" min="1" max="10" step="1" value="${state.effort}"></div><div class="field"><div class="field-label"><span>可能影响计划的模拟反馈</span></div><select id="obstacle" aria-label="模拟反馈原因"><option value="unknown" ${state.obstacle==='unknown'?'selected':''}>尚不知道原因</option><option value="time" ${state.obstacle==='time'?'selected':''}>模拟客户时间不够</option><option value="equipment" ${state.obstacle==='equipment'?'selected':''}>器械没有到位</option><option value="fatigue" ${state.obstacle==='fatigue'?'selected':''}>恢复状态欠佳</option><option value="pain" ${state.obstacle==='pain'?'selected':''}>模拟出现持续不适</option></select></div><button class="btn btn-dark btn-wide" data-action="saveLog">${state.saved?'更新模拟日志':'保存模拟日志'} ${ico('check',16)}</button>${state.saved?`<div class="summary flushed">✓ 已保存于本次网页会话中（不会上传或长期保存）。<br>只有“完成”的项目可计入示例完成数；部分完成、漏做和未知都不会被补记。${state.obstacle==='pain'?'<br>模拟持续不适：阻断负荷进阶，建议专业评估。':''}</div>`:''}</div><div class="section"><button class="btn btn-white btn-wide" data-nav="adjust">查看日志驱动的调整解释 ${ico('arrow',16)}</button></div>`;}
const EVENTS=[['conflict','🗓️','原时间突然冲突','旧时段失效，不擅自安排新日'],['missed','⏭️','本周漏练了一次','不补债，不自动增加第四次'],['noequip','🎒','器械尚未购买','条件不足不强行生成完整计划'],['pain','🩹','模拟出现膝部不适','停止相关进阶，进一步核实'],['overtime','⏱️','时间不够做完','先核实原因，优先保留关键步骤']];
function adjustmentData(k){switch(k){case'conflict':return{title:'先暂停旧时段，等待新的空档',type:'yellow',items:['已确认冲突的训练日不能继续标记为可执行。','在客户确认另一个可用时段前，不自动把周一改成周二。','如确认新的三天安排，先检查相邻日期的恢复负荷，而不是额外添加第四次训练。'],facts:'模拟更新：原定时段发生冲突；新日期尚未核实。'};case'missed':return{title:'漏练不等于欠一次训练',type:'green',items:['历史未完成的训练保留为“未做”，不补填。','不把本周额外补练作为自动提升训练量的理由。','下次计划先考虑工作时间、恢复状态和当前总训练量。'],facts:'模拟更新：本周实际只完成部分训练。'};case'noequip':return{title:'计划降级为条件受限',type:'yellow',items:['计划购买的器械仍标为“未拥有”。','场地未确认有稳定墙面和支撑时，不强制相关动作。','缺少推拉训练条件时，不称作完整增肌计划。'],facts:'模拟更新：器械尚未到位。'};case'pain':return{title:'模拟不适优先于加量',type:'red',items:['对出现持续不适的相关动作暂停训练及负荷进阶。','不根据某个疼痛分数直接推断诊断或精确恢复日期。','如果真实生活出现持续、加重或异常症状，应向专业人员求助。'],facts:'模拟更新：存在需要进一步确认的膝部不适。'};default:return{title:'先保留事实，再优化时间',type:'green',items:['未完成的动作不被视为已经完成。','先确认时间耗在热身、等待器械、组间休息还是其他环节，不猜测原因。','仅在模拟演示中把辅助项目移到可选区，保留时间与整理环节。'],facts:'模拟更新：时长不足，真正原因尚未确认。'};}}
function adjust(){const cp=checkpoints(),choice=state.choice;const msg=choice?adjustmentData(choice):null;return `<div class="eyebrow">复盘 / RULE DEMO</div><h1 class="page-title">情况变了，计划也要有理由。</h1><p class="page-desc">选择一个虚构事件，查看 V1.3.4 的决策规则如何约束调整。这里没有 AI 后台，也不根据真人健康数据推算训练量。</p><div class="section" style="margin-top:0"><div class="section-head"><h2>选择一个事件</h2><div class="hint">可重复切换</div></div><div class="action-grid">${EVENTS.map(([id,emoji,title,desc])=>`<button class="sim-event ${choice===id?'selected':''}" data-event="${id}"><div class="sim-icon">${emoji}</div><b>${title}</b><span>${desc}</span></button>`).join('')}</div></div>${msg?`<div class="outcome"><span class="tag tag-${msg.type==='red'?'red':msg.type==='yellow'?'yellow':'green'}">规则演示 · ${choice==='pain'?'安全优先':'有条件调整'}</span><h3>${msg.title}</h3><div class="micro">${msg.facts}</div><ul>${msg.items.map(x=>`<li>${x}</li>`).join('')}</ul>${state.saved?`<hr class="separator"><div class="hint">关联模拟日志：${state.logs.items.filter(x=>x.status==='done').length} 项标为完成，${state.logs.items.filter(x=>x.status==='partial').length} 项部分完成，${state.logs.items.filter(x=>x.status==='skip').length} 项未做。模拟用时 ${state.minutes} 分钟，主观强度 ${state.effort}/10。${state.obstacle==='unknown'?'缺失原因仍不能推断。':''}</div>`:''}</div>`:`<div class="lab">请选择一项事件查看解释。示例事件互相独立，不会偷偷修改旧日志，也不会将前一个虚构客户的信息写入新客户。</div>`}<div class="section"><button class="btn btn-dark btn-wide" data-nav="feedback">完成体验并提交本地反馈 ${ico('arrow',17)}</button></div>`;}
function feedback(){const elapsed=Math.max(1,Math.round((Date.now()-state.started)/60000)),cp=checkpoints();return `<div class="eyebrow">体验反馈 / USER STUDY</div><h1 class="page-title">你觉得这个体验怎么样？</h1><p class="page-desc">只对交互和管理功能反馈，不需要提供个人身份信息。数据留在浏览器会话中，可以选择导出模拟体验摘要。</p><div class="card"><h3>操作流程容易理解吗？</h3><p class="hint" style="margin-top:7px;margin-bottom:15px">1 = 很难，5 = 非常容易</p><div class="feedback-grid">${[1,2,3,4,5].map(x=>`<button class="rate ${state.rate===x?'sel':''}" data-rate="${x}">${x}</button>`).join('')}</div><hr class="separator"><h3>你愿意为非处方的训练记录与计划管理功能付费吗？</h3><p class="hint" style="margin:9px 0 14px">这里只验证意愿，不收费、不承诺未来功能。</p><div class="options">${[['yes','愿意了解付费版'],['maybe','看价格和功能再决定'],['no','暂时不考虑']].map(([val,text])=>`<button class="opt ${state.willing===val?'selected':''}" data-willing="${val}"><span>${text}</span><span class="circle">${state.willing===val?ico('check',13):''}</span></button>`).join('')}</div><hr class="separator"><h3>本次体验的完成情况</h3><div style="margin-top:12px">${[['interview','问答访谈'],['plan','计划展示'],['log','日志输入'],['adjust','调整演示']].map(([id,n])=>`<div class="task-row"><div class="task-dot ${cp[id]?'done':''}">${cp[id]?ico('check',14):'·'}</div><div class="task-name">${n}</div><span class="tag ${cp[id]?'tag-green':'tag-gray'}">${cp[id]?'已体验':'未完成'}</span></div>`).join('')}</div><p class="micro flushed">当前页面打开约 ${elapsed} 分钟（仅本地估算）。</p><div class="action-grid"><button class="btn btn-dark" data-action="export">导出体验反馈 ${ico('arrow',16)}</button><button class="btn btn-white" data-action="restart">重新开始</button></div><p class="micro flushed">导出文件仅包含虚构选择与体验评分，不包含姓名、电话、设备识别信息或任何真实健康资料。</p></div>`;}
function render(){let s='';switch(state.page){case 'home':s=home();break;case 'interview':s=interview();break;case 'plan':s=plan();break;case 'log':s=log();break;case 'adjust':state.goalDone.adjust=!!state.choice;s=adjust();break;case 'feedback':s=feedback();break;default:s=home();}wrap(s);}
function go(page){state.page=page;render();window.scrollTo({top:0,behavior:'instant'});}
function exportFeedback(){let cp=checkpoints(),txt=['循练 H5 / 模拟体验反馈','版本：H5 01 · 规则参考 V1.3.4','提示：仅用于产品体验研究，不属于真实训练记录','',`模拟案例：${state.scenario||'未选'}`,`访谈完成：${cp.interview?'是':'否'}`,`计划已看：${cp.plan?'是':'否'}`,`日志已填：${cp.log?'是':'否'}`,`调整已看：${cp.adjust?'是':'否'}`,`易用性评分：${state.rate||'未评'}/5`,`非处方功能付费意愿：${({yes:'愿意了解',maybe:'视情况而定',no:'暂不考虑',undecided:'未回答'})[state.willing]}`,`模拟体验用时约：${Math.max(1,Math.round((Date.now()-state.started)/60000))} 分钟`,'','没有真实客户信息、没有专业安全放行。'].join('\n');const blob=new Blob(['\ufeff'+txt],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='循练_模拟体验反馈.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800);}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;const d=el.dataset;if(d.nav){go(d.nav);return;}if(d.persona){state.scenario=d.persona;state.step=0;state.answers={};state.logs={};state.saved=false;state.choice=null;state.goalDone={};go('interview');return;}if(d.back){if(state.step>0){state.step--;go('interview')}else if(state.scenario){state.scenario=null;go('interview')}return;}if(d.answer){state.answers[QUESTIONS[state.step].key]=d.answer;state.step=Math.min(QUESTIONS.length,state.step+1);go('interview');return;}if(d.logstatus){const [i,v]=d.logstatus.split('|');state.logs.items[+i].status=v;state.saved=false;render();return;}if(d.event){state.choice=d.event;state.goalDone.adjust=true;render();return;}if(d.rate){state.rate=Number(d.rate);render();return;}if(d.willing){state.willing=d.willing;render();return;}if(d.action==='saveLog'){state.saved=true;state.goalDone.log=true;render();return;}if(d.action==='export'){exportFeedback();return;}if(d.action==='restart'){if(window.confirm('重新开始将清空本次页面的虚构选择与模拟日志，确定吗？')){state.scenario=null;state.step=0;state.answers={};state.logs={};state.saved=false;state.choice=null;state.rate=0;state.willing='undecided';state.goalDone={};state.started=Date.now();go('home')}return;}});
document.addEventListener('input',e=>{if(e.target.id==='minutes'){state.minutes=Number(e.target.value);document.getElementById('minutesLabel').textContent=state.minutes;state.saved=false;}if(e.target.id==='effort'){state.effort=Number(e.target.value);document.getElementById('effortLabel').textContent=state.effort;state.saved=false;}if(e.target.id==='obstacle'){state.obstacle=e.target.value;state.saved=false;}if(!state.saved){const sum=document.querySelector('.card > .summary.flushed');if(sum)sum.remove();const save=document.querySelector('[data-action=saveLog]');if(save)save.innerHTML='保存模拟日志';}});
render();
})();
</script></body></html>
