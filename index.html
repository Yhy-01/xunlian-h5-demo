function wrap(content){const cp=checkpoints();document.getElementById('app').innerHTML=`<div class="shell"><aside class="side"><div class="brand"><div class="brand-mark">${ico('spark',22)}</div><div>循练<small>FIT FLOW · DEMO</small></div></div><div class="side-caption">探索原型 / EXPLORE</div><div class="side-nav">${navs.map(([id,label,icon])=>`<button class="nav-btn ${state.page===id?'active':''}" data-nav="${id}"><span class="nav-icon">${ico(icon)}</span>${label}${cp[id]?' ·':''}</button>`).join('')}</div><div class="side-note"><b>仅供产品体验</b>所有身份、训练计划和日志均为合成示例。无需登录，不向服务器提交信息，不提供真实运动处方。</div></aside><main class="main"><div class="topbar"><div class="eyebrow">FIT FLOW / V0.2B 开发预览</div><div class="topright"><span class="version">基于 Skill V1.3.4</span><span class="safe-pill">● 未经真人审核</span></div></div><div class="screen-in">${content}</div></main></div><nav class="bottom" aria-label="主导航">${navs.map(([id,label,icon])=>`<button class="${state.page===id?'active':''}" data-nav="${id}" aria-label="${label}">${ico(icon)}<span>${label}</span></button>`).join('')}</nav>`;}
function home(){const cp=checkpoints();return `<div class="hero"><small>${ico('spark',15)} FIRST INTERACTIVE PROTOTYPE</small><h1>好计划，<br>从了解开始。</h1><p>7个简短问题，让虚构客户完成训练访谈，再体验计划展示、打卡和动态调整。无需登录，也不收集真实健康数据。</p><div class="hero-actions"><button class="btn btn-primary" data-nav="interview">开始模拟体验 ${ico('arrow',16)}</button><button class="btn btn-ghost" data-nav="plan">看看计划预览</button></div></div><div class="section"><div class="section-head"><h2>一份计划，四段体验</h2><div class="hint">用时因人而异<br>无需账号</div></div><div class="feature-grid"><div class="feature"><div class="feature-icon">${ico('chat')}</div><h3>逐步访谈</h3><p>每次只问一个关键问题，未知就标未知。</p></div><div class="feature"><div class="feature-icon">${ico('plan')}</div><h3>计划草稿</h3><p>展示虚构日程、动作模式及时间预算。</p></div><div class="feature"><div class="feature-icon">${ico('log')}</div><h3>训练日志</h3><p>体验完成、部分完成、跳过与原因记录。</p></div><div class="feature"><div class="feature-icon">${ico('adjust')}</div><h3>调整演示</h3><p>遇到冲突、缺设备或不适时展示规则。</p></div></div></div><div class="section"><div class="section-head"><h2>你的体验进度</h2><span class="tag tag-gray">${Object.values(cp).filter(Boolean).length} / 4</span></div><div class="card">${[['interview','完成虚构客户访谈','约7个问题'],['plan','查看示例计划','状态、器械和时间检查'],['log','填写一份模拟日志','无真实运动数据'],['adjust','查看一次计划调整','有原因才有变化']].map(([id,t,sub],i)=>`<div class="task-row"><div class="task-dot ${cp[id]?'done':''}">${cp[id]?ico('check',15):i+1}</div><div><div class="task-name">${t}</div><div class="task-sub">${sub}</div></div><button class="small-link" data-nav="${id}">${cp[id]?'再看':'进入'} ›</button></div>`).join('')}</div></div><div class="section"><div class="notice">${ico('shield',17)}<span>本原型由 V1.3.4 的部分已测规则制作，使用固定的本地模拟逻辑，不连接 Claude 或任何 AI 服务。展示仅用于评估产品交互，禁止按页面计划实际训练。</span></div></div>`;}

function interview(){if(!state.scenario)return persona();if(state.step>=QUESTIONS.length)return profile();const q=QUESTIONS[state.step],progress=Math.round(state.step/QUESTIONS.length*100);return `<button class="back-link" data-back="1">← ${state.step===0?'更换模拟客户':'上一个问题'}</button><div class="eyebrow">访谈 / ${selected().name}</div><div class="q-progress" aria-label="进度 ${progress}%"><i style="width:${progress}%"></i></div><div class="q-card"><div class="q-serial">${ico('chat',16)} QUESTION ${String(state.step+1).padStart(2,'0')} / ${String(QUESTIONS.length).padStart(2,'0')}</div><h2>${q.title}</h2><p class="q-desc">${q.desc}</p><div class="options">${q.opts.map(([v,label])=>`<button class="opt ${state.answers[q.key]===v?'selected':''}" data-answer="${escapeHtml(v)}"><span>${escapeHtml(label)}</span><span class="circle">${state.answers[q.key]===v?ico('check',13):''}</span></button>`).join('')}</div><div class="q-footer"><span>点选后自动进入下一题 · 可返回修改</span><span>${state.step+1} / ${QUESTIONS.length}</span></div></div><div class="profile-chips"><span class="chip">${selected().emoji} ${selected().age}</span><span class="chip">模拟模式</span><span class="chip">无真实资料上传</span></div>`;}

const DEMO_TIME_BUDGETS={

function progressTrail(active){

function timeBudgetHtml(){
  const limit=Number(state.answers.duration);
  const rows=DEMO_TIME_BUDGETS[limit];
  if(!rows)return '';
  const sum=rows.reduce((n,row)=>n+row[1],0);
  if(sum!==limit)throw new Error('演示时间预算不守恒');
  const bars=rows.map(row=>'<span style="width:'+(row[1]/limit*100)+'%;background:'+row[2]+'" title="'+row[0]+' '+row[1]+'分钟"></span>').join('');

}
function plan(){if(!state.scenario||!QUESTIONS.every(q=>state.answers[q.key]))return `<div class="eyebrow">计划 / PREVIEW</div><h1 class="page-title">先完成模拟访谈</h1><p class="page-desc">计划草稿必须基于当前虚构客户选择的条件生成，不能借用其他案例。</p><button class="btn btn-dark" data-nav="interview">进入访谈 ${ico('arrow',16)}</button>`;state.goalDone.plan=true;const st=status();const isBlock=st==='BLOCKED_SAFETY',isNeed=st==='NEED_ONE_ANSWER',isProv=st==='PROVISIONAL',labels={BLOCKED_SAFETY:['风险阻断','模拟档案存在值得专业评估的不适或风险。此处不展示具体训练量。'],NEED_ONE_ANSWER:['关键信息不足','训练日、时长、安全或器械条件存在未知项，暂不展示完整训练卡。'],PROVISIONAL:['条件受限草稿','器械尚未拥有或支撑条件不明，只展示环境准备与能力基础阶段，不能称为完整增肌方案。'],READY:['模拟计划草稿','虚构数据的日程与条件满足本页演示逻辑，不代表实际训练安全通过。']}[st]||['暂无计划',''];let dayrows=planDays[state.answers.days]||[];return `<div class="eyebrow">计划 / MOCK PLAN</div><h1 class="page-title">让计划有依据。</h1><p class="page-desc">示例不包含个人真实训练重量，也不会将模拟就绪状态视为医疗或教练批准。</p>${progressTrail('plan')}<div class="plan-banner" ${isBlock?'danger':(isNeed||isProv)?'warn':''}"><span class="tag ${isBlock?'tag-red':(isNeed||isProv)?'tag-yellow':'tag-green'}">${st}</span><h2>${labels[0]}</h2><p>${labels[1]}</p></div><div class="plan-info"><div class="stat"><div class="stat-value">${state.answers.days==='unknown'?'待确认':'3天'}</div><div class="stat-label">周频率 / 虚构</div></div><div class="stat"><div class="stat-value">${state.answers.duration==='unknown'?'未知':state.answers.duration+'min'}</div><div class="stat-label">单次时长</div></div><div class="stat"><div class="stat-value">${selected().emoji}</div><div class="stat-label">案例 ${state.scenario==='gym'?'A':state.scenario==='outdoor'?'B':'C'}</div></div></div>${isBlock?`<div class="section"><div class="notice">${ico('alert',18)}<span>演示分支已阻断训练处方。对于现实中的胸痛、晕厥、异常气促、未评估的严重血压问题或持续伤痛，应当由医疗专业人员判断，不由本网页放行训练。</span></div></div>`:isNeed?`<div class="section"><div class="card"><h3>缺少的关键确认</h3><p class="page-desc" style="margin-top:9px">${state.answers.screen==='unknown'?'虚构客户的基本风险资料尚未填写。':state.answers.days==='unknown'?'虚构客户尚未确认训练日。':state.answers.duration==='unknown'?'每次可用时间未知。':state.answers.recovery==='unknown'?'恢复情况尚未确认。':state.answers.recovery==='tired'?'模拟客户明显疲劳，暂不出完整计划，先确认恢复情况。':'场地和器械条件未核实。'}</p><button class="btn btn-white" data-nav="interview">回到访谈完善</button></div></div>`:isProv?`<div class="section"><div class="card"><h3 style="margin-bottom:10px">目前只能展示受限阶段</h3><p class="page-desc">未实际购入的弹力带不可安排为必备器械；未知的墙面或桌沿也不应默认安全。无合适推拉训练条件时，不能宣称完整增肌。</p><div class="lab">已确认：${escapeHtml(answerLabel('equipment',state.answers.equipment))}<br>仍未知：稳定支撑、可用推拉阻力、现场安全条件。<br>建议产品操作：询问缺少的条件，先展示条件确认卡，暂不生成完整训练处方。</div></div></div>`:`<div class="section">${timeBudgetHtml()}<div class="section-head"><h2>一周训练卡 · 虚构示例</h2><div class="hint">点击日期展开或收起<br>无公斤数 / 不可跟练</div></div>${dayrows.map(([day,name],i)=>`<details class="day-card" ${i===0?'open':''}><summary class="day-head"><div><strong>${day} · ${name}</strong><div class="micro" style="margin-top:5px">${i===2?'与周五相邻，必须复核负荷重叠':'模拟训练结构与动作模式'}</div></div><span class="tag tag-gray">DAY 0${i+1}</span><span class="chevron" aria-hidden="true">⌄</span></summary>${exercises(i).map(exerciseHtml).join('')}</details>`).join('')}<div class="lab">已按上方预算预留热身、休息、器械切换及整理时间；点开每天卡片可查看该日动作模式。真实可用器械、动作技术与恢复未经过专业核实。历史负荷与实际完成记录均为未知。</div></div>`}<div class="section"><div class="section-head"><h2>下一步怎么体验？</h2></div><div class="action-grid"><button class="btn btn-white" data-nav="log">填写模拟训练日志 ${ico('log',16)}</button><button class="btn btn-dark" data-nav="adjust">体验计划变化 ${ico('adjust',16)}</button></div><p class="micro flushed">模拟测试规则来自 V1.3.4；这不是实时调用 AI 的个性化建议。</p></div>`;}
function initialLogs(){return [{title:'动作模式A · 推',status:'unknown'},{title:'动作模式B · 拉',status:'unknown'},{title:'动作模式C · 下肢',status:'unknown'},{title:'辅助动作D',status:'unknown'}]}
function invalidateSavedLog(){state.saved=false;state.savedLog=null;state.goalDone.log=false;state.goalDone.adjust=!!state.choice;}
function log(){if(!state.scenario)return `<h1 class="page-title">先选择虚构客户</h1><p class="page-desc">日志输入仅用于演示，必须绑定当前模拟档案。</p><button class="btn btn-dark" data-nav="interview">开始访谈</button>`;if(!state.logs.items)state.logs.items=initialLogs();return `<div class="eyebrow">日志 / DEMO INPUT</div>${progressTrail('log')}<h1 class="page-title">每一次训练，都有迹可循。</h1><p class="page-desc">只填写虚构案例的完成情况。所有动作默认“未记录”，请主动选择；未做不算完成，不补造重量、组数或次数。</p><div class="card"><div class="section-head" style="margin-bottom:4px"><h2>模拟训练日志</h2><span class="tag tag-yellow">非真实记录</span></div>${state.logs.items.map((x,i)=>`<div class="log-row"><div><h4>${x.title}</h4><p>默认未记录 · 可逐项调整</p></div><div class="togglebar">${[['done','完成'],['partial','部分完成'],['skip','未做'],['unknown','未记录']].map(([v,label])=>`<button class="tog ${x.status===v?'sel':''}" data-logstatus="${i}|${v}">${label}</button>`).join('')}</div></div>`).join('')}<hr class="separator"><div class="field"><div class="field-label"><span>模拟训练用时（示例值可调整）</span><small><span id="minutesLabel">${state.minutes}</span> 分钟</small></div><input aria-label="模拟训练用时" id="minutes" type="range" min="20" max="75" step="1" value="${state.minutes}"></div><div class="field"><div class="field-label"><span>模拟整体吃力程度（示例值可调整）</span><small><span id="effortLabel">${state.effort}</span>/10</small></div><input aria-label="模拟整体吃力程度" id="effort" type="range" min="1" max="10" step="1" value="${state.effort}"></div><div class="field"><div class="field-label"><span>可能影响计划的模拟反馈</span></div><select id="obstacle" aria-label="模拟反馈原因"><option value="unknown" ${state.obstacle==='unknown'?'selected':''}>尚不知道原因</option><option value="time" ${state.obstacle==='time'?'selected':''}>模拟客户时间不够</option><option value="equipment" ${state.obstacle==='equipment'?'selected':''}>器械没有到位</option><option value="fatigue" ${state.obstacle==='fatigue'?'selected':''}>恢复状态欠佳</option><option value="pain" ${state.obstacle==='pain'?'selected':''}>模拟出现持续不适</option></select></div><button class="btn btn-dark btn-wide" data-action="saveLog">${state.saved?'更新模拟日志':'保存模拟日志'} ${ico('check',16)}</button>${state.saved?`<div class="summary flushed">✓ 已保存于本次网页会话中（不会上传或长期保存）。<br>未完成和未记录均不会被补记。复盘结果只依据本次已保存的虚构日志，不凭一次记录自动加量。${state.obstacle==='pain'?'<br>模拟持续不适：阻断相关训练进阶，建议专业评估。':''}</div>`:''}</div><div class="section"><button class="btn btn-white btn-wide" data-nav="adjust">查看日志驱动的调整解释 ${ico('arrow',16)}</button></div>`;}
const EVENTS=[['conflict','🗓️','原时间突然冲突','旧时段失效，不擅自安排新日'],['missed','⏭️','本周漏练了一次','不补债，不自动增加第四次'],['noequip','🎒','器械尚未购买','条件不足不强行生成完整计划'],['pain','🩹','模拟出现膝部不适','停止相关进阶，进一步核实'],['overtime','⏱️','时间不够做完','先核实原因，优先保留关键步骤']];
function adjustmentData(k){switch(k){case'conflict':return{title:'先暂停旧时段，等待新的空档',type:'yellow',items:['已确认冲突的训练日不能继续标记为可执行。','在客户确认另一个可用时段前，不自动把周一改成周二。','如确认新的三天安排，先检查相邻日期的恢复负荷，而不是额外添加第四次训练。'],facts:'模拟更新：原定时段发生冲突；新日期尚未核实。'};case'missed':return{title:'漏练不等于欠一次训练',type:'green',items:['历史未完成的训练保留为“未做”，不补填。','不把本周额外补练作为自动提升训练量的理由。','下次计划先考虑工作时间、恢复状态和当前总训练量。'],facts:'模拟更新：本周实际只完成部分训练。'};case'noequip':return{title:'计划降级为条件受限',type:'yellow',items:['计划购买的器械仍标为“未拥有”。','场地未确认有稳定墙面和支撑时，不强制相关动作。','缺少推拉训练条件时，不称作完整增肌计划。'],facts:'模拟更新：器械尚未到位。'};case'pain':return{title:'模拟不适优先于加量',type:'red',items:['对出现持续不适的相关动作暂停训练及负荷进阶。','不根据某个疼痛分数直接推断诊断或精确恢复日期。','如果真实生活出现持续、加重或异常症状，应向专业人员求助。'],facts:'模拟更新：存在需要进一步确认的膝部不适。'};default:return{title:'先保留事实，再优化时间',type:'green',items:['未完成的动作不被视为已经完成。','先确认时间耗在热身、等待器械、组间休息还是其他环节，不猜测原因。','仅在模拟演示中把辅助项目移到可选区，保留时间与整理环节。'],facts:'模拟更新：时长不足，真正原因尚未确认。'};}}

function deriveLogDecision(snapshot){
  // V0.2B: deterministic, simulated-only decisions. This is not a clinical exercise prescription.
  if(!snapshot||!Array.isArray(snapshot.items))return null;
  const entries=snapshot.items;
  const counts={done:0,partial:0,skip:0,unknown:0};
  entries.forEach(x=>{if(Object.prototype.hasOwnProperty.call(counts,x.status))counts[x.status]++;else counts.unknown++});
  const core=entries.slice(0,3);
  const available=Number(state.answers.duration);
  const budget=available===40||available===60?available:null;
  const facts=[
    '记录为完成 '+counts.done+' 项、部分完成 '+counts.partial+' 项、未做 '+counts.skip+' 项、未记录 '+counts.unknown+' 项',
    '模拟用时 '+snapshot.minutes+' 分钟'+(budget?'（设定上限 '+budget+' 分钟）':'（训练时长上限未知）'),
    '模拟主观吃力程度 '+snapshot.effort+'/10',
    '反馈原因：'+({'unknown':'尚未确认','time':'自述时间不足','equipment':'器械未到位','fatigue':'自述恢复欠佳','pain':'自述持续不适'})[snapshot.obstacle]
  ];
  const decision=(code,tone,title,why,next,steps)=>({code,tone,title,why,next,steps,facts,counts});
  const current=status();
  if(current==='BLOCKED_SAFETY')return decision('SAFETY_BLOCK','red','原始安全条件未通过','虚构档案存在需要专业评估的风险，任何日志都不能取消原始安全阻断。','停止展示训练进阶，不设置下次训练负荷。',['保留已有记录，不把本次模拟完成当作医学放行。','应由合格专业人员判断相关风险，静态演示不能授权训练。']);
  if(snapshot.obstacle==='pain')return decision('STOP_AND_ASSESS','red','模拟不适：暂停相关进阶','已保存日志明确选择“模拟出现持续不适”，优先级高于完成次数和主观吃力程度。','暂停相关动作与加量，等待专业评估。',['不能因其他动作完成良好就忽略不适。','不推断疼痛原因、康复天数或安全重量。']);
  if(current!=='READY')return decision('PROFILE_NOT_READY','yellow','条件尚不足：不展示进阶','虚构画像状态为 '+current+'；日志不能补足尚未核实的器械、风险、时间或恢复条件。','保持条件受限或资料待确认状态。',['先回访确认缺失的环境与安全信息。','不把计划购买的器械视为已经拥有，也不捏造新的训练日。']);
  if(snapshot.obstacle==='fatigue'||snapshot.effort>=8)return decision('RECOVERY_REVIEW','yellow','先复核疲劳与恢复','日志中的恢复反馈或整体吃力程度提示需要谨慎；单次主观评分不足以估算安全加量幅度。','本轮禁止增加负荷，保留现有记录并核实恢复。',['复核睡眠、持续疲劳及是否出现异常不适。','不延长训练或补做漏掉的动作。']);
  if(snapshot.obstacle==='equipment')return decision('EQUIPMENT_UNAVAILABLE','yellow','器械条件发生变化','已保存日志标记器械未到位，不能按原示意动作默认器械可用。','暂停依赖该器械的演示进阶，先核实可用条件。',['不把准备购买的器械当作已购入。','未知器械与安全支撑不能被虚构替代。']);
  if(core.length<3||core.some(x=>x.status==='unknown'||!['done','partial','skip'].includes(x.status)))return decision('NEED_CORE_LOG','yellow','关键完成记录不齐','A/B/C 三个主要动作模式中仍有未记录项，无法判断它是否真正完成。','保持原计划不进阶，先补齐事实；不允许补造记录。',['未记录的项目只能保留“未知”，不能当成完成或未做。','如自述时间不足，也不能据此推断每项动作的实际状态。']);
  if(snapshot.obstacle==='time'||(budget&&snapshot.minutes>budget))return decision('TIME_BUDGET_REVIEW','yellow','时间预算需要复核','模拟日志已明确标记时间不足，或用时超过已选择的单次时长上限。','下次仅演示“核心优先、辅助可选”，不加练、不补债。',['先确认时间花在热身、组间休息、排队还是器械切换；目前不能自行猜测。','演示中优先保留整理与记录环节，不直接删减安全准备。']);
  if(core.some(x=>x.status==='partial'||x.status==='skip'))return decision('INCOMPLETE_NO_PROGRESS','yellow','部分完成：先维持、不加量','主要动作模式中有明确的部分完成或未做记录；一次反馈不能证明完成能力已经提升。','保持原有演示组次，不自动增加重量或第四次训练。',['未做与部分完成分别保留，不能合并为“已完成”。','可核实原因，但在获知事实之前不改变核心训练量。']);
  return decision('MAINTAIN_AND_OBSERVE','green','完成了示例项目，也不急着进阶','A/B/C 主要模式都标为完成，且当前没有明确不适或超时信号；但只保存了一次虚构记录，没有可比较的连续表现与负重资料。','保留现有演示结构，等待更多可比记录，不自动加重量。',['辅助动作 D 的未知或未做不计入完成，也不会被“补债”。','记录保持清楚，后续进阶仍需动作质量、恢复和连续可比数据。']);
}
function logDecisionHtml(){
  if(!state.saved||!state.savedLog)return '<div class="outcome decision-card"><span class="tag tag-gray">等待日志 · NO_SAVED_LOG</span><h3>先保存虚构日志，再查看规则决定</h3><p class="micro">目前没有可用的已保存日志。不会根据预设事件或默认选项假装你完成过训练。</p><button class="btn btn-white" data-nav="log">填写并保存模拟日志 →</button></div>';
  const result=deriveLogDecision(state.savedLog);
  if(!result)return '';
  const tone=result.tone==='red'?'red':result.tone==='yellow'?'yellow':'green';
  return '<section class="outcome decision-card" aria-live="polite"><span class="tag tag-'+tone+'">日志驱动 · '+result.code+'</span><h3>'+escapeHtml(result.title)+'</h3><p class="decision-why">'+escapeHtml(result.why)+'</p><div class="decision-next"><b>下一次模拟展示</b><div>'+escapeHtml(result.next)+'</div></div><h4>依据已保存的模拟事实</h4><ul class="decision-facts">'+result.facts.map(x=>'<li>'+escapeHtml(x)+'</li>').join('')+'</ul><h4>调整边界</h4><ul>'+result.steps.map(x=>'<li>'+escapeHtml(x)+'</li>').join('')+'</ul><p class="micro flushed">这是固定规则生成的虚构复盘，不会自动编辑训练卡、增加训练重量或输出真人跟练处方。修改日志后必须重新保存，旧结论才可更新。</p><button class="btn btn-white" data-nav="log">返回修改模拟日志 →</button></section>';
}
function adjust(){
  const choice=state.choice;
  const msg=choice?adjustmentData(choice):null;
  return '<div class="eyebrow">复盘 / LOG-DRIVEN DEMO</div>'+progressTrail('adjust')+
    '<h1 class="page-title">先看记录，再决定变化。</h1><p class="page-desc">V0.2B 使用保存的虚构日志自动选择演示规则，不要求先手动选择预设事件。所有结果都是本地确定性逻辑，并非 AI、教练或医疗建议。</p>'+
    '<div class="section" style="margin-top:0"><div class="section-head"><h2>① 已保存日志驱动的结果</h2><span class="tag tag-gray">按事实判断</span></div>'+logDecisionHtml()+'</div>'+
    '<div class="section"><div class="section-head"><h2>② 独立情境演示（可选）</h2><div class="hint">不影响上方日志结论</div></div>'+
    '<p class="micro">以下事件仍为原版 V1.3.4 的独立剧本，用于比较规则；点击事件不会修改日志或自动派发训练。</p>'+
    '<div class="action-grid">'+EVENTS.map(([id,emoji,title,desc])=>'<button class="sim-event '+(choice===id?'selected':'')+'" data-event="'+id+'"><div class="sim-icon">'+emoji+'</div><b>'+title+'</b><span>'+desc+'</span></button>').join('')+'</div></div>'+
    (msg?'<div class="outcome"><span class="tag tag-'+(msg.type==='red'?'red':msg.type==='yellow'?'yellow':'green')+'">独立事件剧本 · 与保存日志无关</span><h3>'+escapeHtml(msg.title)+'</h3><div class="micro">'+escapeHtml(msg.facts)+'</div><ul>'+msg.items.map(x=>'<li>'+escapeHtml(x)+'</li>').join('')+'</ul></div>':'<div class="lab">无需选择事件，上方已自动使用保存的模拟日志判断；若想比较旧版固定事件规则，可在这里选择。</div>')+
    '<div class="section"><button class="btn btn-dark btn-wide" data-nav="feedback">完成体验并提交本地反馈 →</button></div>';
}
function feedback(){const elapsed=Math.max(1,Math.round((Date.now()-state.started)/60000)),cp=checkpoints();return `<div class="eyebrow">体验反馈 / USER STUDY</div><h1 class="page-title">你觉得这个体验怎么样？</h1><p class="page-desc">只对交互和管理功能反馈，不需要提供个人身份信息。数据留在浏览器会话中，可以选择导出模拟体验摘要。</p><div class="card"><h3>操作流程容易理解吗？</h3><p class="hint" style="margin-top:7px;margin-bottom:15px">1 = 很难，5 = 非常容易</p><div class="feedback-grid">${[1,2,3,4,5].map(x=>`<button class="rate ${state.rate===x?'sel':''}" data-rate="${x}">${x}</button>`).join('')}</div><hr class="separator"><h3>你愿意为非处方的训练记录与计划管理功能付费吗？</h3><p class="hint" style="margin:9px 0 14px">这里只验证意愿，不收费、不承诺未来功能。</p><div class="options">${[['yes','愿意了解付费版'],['maybe','看价格和功能再决定'],['no','暂时不考虑']].map(([val,text])=>`<button class="opt ${state.willing===val?'selected':''}" data-willing="${val}"><span>${text}</span><span class="circle">${state.willing===val?ico('check',13):''}</span></button>`).join('')}</div><hr class="separator"><h3>本次体验的完成情况</h3><div style="margin-top:12px">${[['interview','问答访谈'],['plan','计划展示'],['log','日志输入'],['adjust','调整演示']].map(([id,n])=>`<div class="task-row"><div class="task-dot ${cp[id]?'done':''}">${cp[id]?ico('check',14):'·'}</div><div class="task-name">${n}</div><span class="tag ${cp[id]?'tag-green':'tag-gray'}">${cp[id]?'已体验':'未完成'}</span></div>`).join('')}</div><p class="micro flushed">当前页面打开约 ${elapsed} 分钟（仅本地估算）。</p><div class="action-grid"><button class="btn btn-dark" data-action="export">导出体验反馈 ${ico('arrow',16)}</button><button class="btn btn-white" data-action="restart">重新开始</button></div><p class="micro flushed">导出文件仅包含虚构选择与体验评分，不包含姓名、电话、设备识别信息或任何真实健康资料。</p></div>`;}
function render(){let s='';switch(state.page){case 'home':s=home();break;case 'interview':s=interview();break;case 'plan':s=plan();break;case 'log':s=log();break;case 'adjust':state.goalDone.adjust=!!state.choice||!!state.saved;s=adjust();break;case 'feedback':s=feedback();break;default:s=home();}wrap(s);}
function go(page){state.page=page;render();window.scrollTo({top:0,behavior:'instant'});}
function exportFeedback(){let cp=checkpoints(),txt=['循练 H5 / 模拟体验反馈','版本：V0.2B开发预览 · 规则参考 V1.3.4','提示：仅用于产品体验研究，不属于真实训练记录','',`模拟案例：${state.scenario||'未选'}`,`访谈完成：${cp.interview?'是':'否'}`,`计划已看：${cp.plan?'是':'否'}`,`日志已填：${cp.log?'是':'否'}`,`调整已看：${cp.adjust?'是':'否'}`,`易用性评分：${state.rate||'未评'}/5`,`非处方功能付费意愿：${({yes:'愿意了解',maybe:'视情况而定',no:'暂不考虑',undecided:'未回答'})[state.willing]}`,`模拟体验用时约：${Math.max(1,Math.round((Date.now()-state.started)/60000))} 分钟`,state.savedLog?'日志驱动决策：'+deriveLogDecision(state.savedLog).code:'日志驱动决策：未保存日志','','没有真实客户信息、没有专业安全放行。'].join('\n');const blob=new Blob(['\ufeff'+txt],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='循练_模拟体验反馈.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800);}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;const d=el.dataset;if(d.nav){go(d.nav);return;}if(d.persona){state.scenario=d.persona;state.step=0;state.answers={};state.logs={};state.saved=false;state.savedLog=null;state.minutes=54;state.effort=5;state.obstacle='unknown';state.choice=null;state.goalDone={};go('interview');return;}if(d.back){if(state.step>0){state.step--;go('interview')}else if(state.scenario){state.scenario=null;go('interview')}return;}if(d.answer){const key=QUESTIONS[state.step].key;if(state.answers[key]!==d.answer){state.logs={};state.saved=false;state.savedLog=null;state.choice=null;state.goalDone={};state.minutes=54;state.effort=5;state.obstacle='unknown';}state.answers[key]=d.answer;state.step=Math.min(QUESTIONS.length,state.step+1);go('interview');return;}if(d.logstatus){const [i,v]=d.logstatus.split('|');state.logs.items[+i].status=v;invalidateSavedLog();render();return;}if(d.event){state.choice=d.event;state.goalDone.adjust=true;render();return;}if(d.rate){state.rate=Number(d.rate);render();return;}if(d.willing){state.willing=d.willing;render();return;}if(d.action==='saveLog'){state.savedLog={items:state.logs.items.map(x=>({title:x.title,status:x.status})),minutes:state.minutes,effort:state.effort,obstacle:state.obstacle};state.saved=true;state.goalDone.log=true;render();return;}if(d.action==='export'){exportFeedback();return;}if(d.action==='restart'){if(window.confirm('重新开始将清空本次页面的虚构选择与模拟日志，确定吗？')){state.scenario=null;state.step=0;state.answers={};state.logs={};state.saved=false;state.savedLog=null;state.minutes=54;state.effort=5;state.obstacle='unknown';state.choice=null;state.rate=0;state.willing='undecided';state.goalDone={};state.started=Date.now();go('home')}return;}});
document.addEventListener('input',e=>{if(e.target.id==='minutes'){state.minutes=Number(e.target.value);document.getElementById('minutesLabel').textContent=state.minutes;invalidateSavedLog();}if(e.target.id==='effort'){state.effort=Number(e.target.value);document.getElementById('effortLabel').textContent=state.effort;invalidateSavedLog();}if(e.target.id==='obstacle'){state.obstacle=e.target.value;invalidateSavedLog();}if(!state.saved){const sum=document.querySelector('.card > .summary.flushed');if(sum)sum.remove();const save=document.querySelector('[data-action=saveLog]');if(save)save.innerHTML='保存模拟日志';}});
render();
})();
</script></body></html>
